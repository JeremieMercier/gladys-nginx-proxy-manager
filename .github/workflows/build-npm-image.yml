# -----------------------------------------------------------------------------
# Build & publish the ADAPTED Nginx Proxy Manager image (the sub-container).
#
# The Gladys sandbox drops all Linux capabilities from sub-containers; the
# stock jc21/nginx-proxy-manager image cannot boot there (see
# npm-image/Dockerfile). This workflow builds the adapted image declared by
# the manifest `containers` field:
#   ghcr.io/<owner>/<repo>-npm:2
#
# Runs on demand and whenever npm-image/ changes. Re-run it from time to time
# (or on a schedule) to pick up upstream jc21/nginx-proxy-manager:2 updates:
# the FROM tag tracks the upstream v2 line.
# -----------------------------------------------------------------------------

name: Build NPM sub-container image

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['npm-image/**', '.github/workflows/build-npm-image.yml']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        run: |
          # ghcr requires a lowercase repository path.
          image="ghcr.io/${GITHUB_REPOSITORY,,}-npm"
          echo "tags=${image}:2" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: npm-image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
